name: Build Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'net_monitor.py'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name NetMonitor net_monitor.py

      - uses: actions/upload-artifact@v4
        with:
          name: NetMonitor-Windows
          path: dist/NetMonitor.exe
